content:
  - name: home
    label: Homepage
    description: "Beheer hier de teksten op de homepage: welkomsttekst, contactgegevens, de 'Onze zorg' kaarten en de introtekst bij 'Ons Team'. De teamleden zelf worden beheerd via 'Ons Team Pagina' hieronder."
    type: file
    path: content/index.json
    fields:
      - name: hero_title
        label: Hoofdtitel (bovenaan de pagina)
        type: string
      - name: hero_subtitle
        label: Ondertitel (bovenaan de pagina)
        type: text
      - name: location_title
        label: "Titel contactsectie (bijv. 'Bezoek of bel ons')"
        type: string
      - name: location_subtitle
        label: Introductietekst contactsectie
        type: text
      - name: address
        label: Adres
        type: string
      - name: phone
        label: Telefoonnummer
        description: "Bijv. '050-8795127' — wordt automatisch een klikbare telefoonlink."
        type: string
      - name: email
        label: E-mailadres
        description: "Wordt automatisch een klikbare e-maillink."
        type: string
      - name: hours_weekday
        label: "Openingstijden doordeweeks (bijv. 'Ma–Vr: 08:30–17:00')"
        type: string
      - name: hours_weekend
        label: "Openingstijden weekend (bijv. 'Za–Zo: Gesloten')"
        type: string
      - name: services_title
        label: "Titel 'Onze zorg' sectie"
        type: string
      - name: services_subtitle
        label: "Introductietekst 'Onze zorg' sectie"
        type: text
      - name: service_1_title
        label: Kaart 1 titel
        description: "Deze kaart linkt altijd naar Behandelingen > cat1 (Preventieve Zorg). De link zelf is niet aanpasbaar via de CMS."
        type: string
      - name: service_1_text
        label: Kaart 1 tekst
        type: text
      - name: service_2_title
        label: Kaart 2 titel
        description: "Deze kaart linkt altijd naar Behandelingen > cat2. De link zelf is niet aanpasbaar via de CMS."
        type: string
      - name: service_2_text
        label: Kaart 2 tekst
        type: text
      - name: service_3_title
        label: Kaart 3 titel
        description: "Deze kaart linkt altijd naar Behandelingen > cat3. De link zelf is niet aanpasbaar via de CMS."
        type: string
      - name: service_3_text
        label: Kaart 3 tekst
        type: text
      - name: service_4_title
        label: Kaart 4 titel
        description: "Deze kaart linkt altijd naar Behandelingen > cat4. De link zelf is niet aanpasbaar via de CMS."
        type: string
      - name: service_4_text
        label: Kaart 4 tekst
        type: text
      - name: team_title
        label: "Titel 'Ons Team' sectie"
        type: string
      - name: team_subtitle
        label: "Introductietekst 'Ons Team' sectie"
        type: text

  - name: our_team
    label: Ons Team Pagina
    description: "Beheer hier de gegevens van elk teamlid zoals ze op de 'Ons Team' pagina verschijnen."
    type: file
    path: content/our-team.json
    fields:
      - name: title
        label: Paginatitel
        description: "De grote titel bovenaan de 'Ons Team' pagina."
        type: string
      - name: subtitle
        label: Introductietekst (onder de titel)
        type: text
      - name: doctors
        label: Teamleden
        type: object
        list: true
        fields:
          - name: name
            label: Naam
            type: string
          - name: role
            label: Functie
            type: string
          - name: license_type
            label: Type registratie
            description: "BIG voor tandartsen, KRT voor mondhygiënisten"
            type: select
            options:
              values: ["BIG", "KRT"]
          - name: license_number
            label: Registratienummer
            type: string
          - name: specializations
            label: Specialisaties
            description: "Komma-gescheiden, bijv. 'Algemene tandheelkunde, Endodontologie'"
            type: string
          - name: languages
            label: Talen
            description: "Komma-gescheiden, bijv. 'Nederlands, Engels'"
            type: string
          - name: bio
            label: Samenvatting
            type: text
          - name: photo
            label: Foto
            description: "Optioneel. Zonder foto wordt een gekleurde cirkel met initialen getoond."
            type: image

  - name: treatments
    label: Behandelingen Pagina
    description: "Beheer hier de categorieën en behandelingen zoals ze op de 'Behandelingen' pagina verschijnen."
    type: file
    path: content/treatments.json
    fields:
      - name: title
        label: Paginatitel
        description: "De grote titel bovenaan de 'Behandelingen' pagina."
        type: string
      - name: subtitle
        label: Introductietekst (onder de titel)
        type: text
      - name: categories
        label: Categorieën
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Titel
            type: string
          - name: intro
            label: Introductietekst
            type: text
          - name: items
            label: Behandelingen in deze categorie
            description: "Eén regel per behandeling. Gebruik de knop om een regel toe te voegen of te verwijderen."
            type: string
            list: true
          - name: slug
            label: "Sprong-link vanaf homepage (optioneel, meestal niet nodig)"
            description: "Laat dit veld leeg — er wordt dan automatisch een technische naam gemaakt op basis van de titel. Vul dit alleen in als een knop op de homepage rechtstreeks naar déze categorie moet springen en die al opengeklapt moet tonen. De 4 bestaande homepage-knoppen gebruiken hiervoor cat1, cat2, cat3 en cat4 — die waarden dus niet hergebruiken voor een nieuwe categorie."
            type: string

  - name: register
    label: Inschrijven Pagina
    description: "Beheer hier de titel, introductietekst, veldlabels, toestemmingstekst en knoptekst van het inschrijfformulier."
    type: file
    path: content/register.json
    fields:
      - name: title
        label: Paginatitel
        description: "De grote titel bovenaan de 'Inschrijven' pagina."
        type: string
      - name: subtitle
        label: Introductietekst (onder de titel)
        type: text
      - name: name_label
        label: "Veldlabel: Naam"
        type: string
      - name: email_label
        label: "Veldlabel: E-mailadres"
        type: string
      - name: bsn_label
        label: "Veldlabel: BSN"
        type: string
      - name: phone_label
        label: "Veldlabel: Telefoonnummer"
        type: string
      - name: consent_text
        label: Tekst bij toestemmingsvakje
        type: text
      - name: submit_label
        label: Tekst op verstuur-knop
        type: string

  - name: patient_information
    label: Patiënteninformatie Pagina
    description: "Beheer hier de titel, introductietekst en secties (met subkopjes, tekst, knoppen en opsommingspunten) van de 'Patiënteninformatie' pagina."
    type: file
    path: content/patient-information.json
    fields:
      - name: title
        label: Paginatitel
        description: "De grote titel bovenaan de 'Patiënteninformatie' pagina."
        type: string
      - name: subtitle
        label: Introductietekst (onder de titel)
        type: text
      - name: sections
        label: Secties
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Sectietitel
            type: string
          - name: intro
            label: Introductietekst (optioneel)
            type: text
          - name: subsections
            label: Onderdelen in deze sectie
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Titel
                type: string
              - name: text
                label: Tekst (optioneel)
                type: text
              - name: cta_label
                label: "Knoptekst (optioneel, bijv. 'Bel 050-8795127')"
                type: string
              - name: cta_url
                label: "Knoplink (optioneel, bijv. 'tel:0508795127')"
                type: string
              - name: points
                label: Opsommingspunten (optioneel)
                description: "Eén regel per punt. Gebruik de knop om een punt toe te voegen of te verwijderen."
                type: string
                list: true

media:
  input: images/team
  output: images/team
